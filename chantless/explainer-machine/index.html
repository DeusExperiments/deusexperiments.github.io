<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chantless, explained step by step</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:300;font-display:swap;src:url(fonts/ibm-plex-mono-normal-300.subset.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-normal-400.subset.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-normal-600.subset.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/ibm-plex-mono-normal-700.subset.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Newsreader';font-style:italic;font-weight:300;font-display:swap;src:url(fonts/newsreader-italic-300.subset.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{--ice:#eaf6ff;--cyan:#7fd8ff;--teal:#4fd6b8;--violet:#9a93ff;--amber:#f2b65a;--coral:#ff6b5e;--ink:#8ea6bb;--dim:#4f6577;--rule:#22364a;
--m:clamp(8px,1.5vw,22px);--ms:clamp(14px,1.8vw,26px);--gx:clamp(20px,3.9vw,56px);--gy:clamp(26px,5.5vh,50px);
--db:clamp(10px,3vh,30px);--btn:clamp(32px,5.2vh,44px);--col:clamp(272px,30vw,440px)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#05070a;color:var(--ink);overflow:hidden;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.embedded canvas{touch-action:pan-y}
.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 80% at 55% 52%,transparent 52%,rgba(0,0,0,.75) 100%)}
.mark{position:fixed;width:var(--ms);height:var(--ms);border-color:var(--rule);border-style:solid;pointer-events:none}
.mark.tl{left:var(--m);top:var(--m);border-width:1px 0 0 1px}.mark.tr{right:var(--m);top:var(--m);border-width:1px 1px 0 0}
.mark.bl{left:var(--m);bottom:var(--m);border-width:0 0 1px 1px}.mark.br{right:var(--m);bottom:var(--m);border-width:0 1px 1px 0}

.head{position:fixed;z-index:1;left:var(--gx);top:var(--gy);width:var(--col);pointer-events:none}
.head::before,.read::before{content:"";position:absolute;z-index:-1;top:calc(-1 * var(--gy));bottom:calc(-1 * var(--fy));pointer-events:none;background:rgba(5,7,10,.92);
--fx:84px;--fy:84px;--to:right;
-webkit-mask-image:linear-gradient(to var(--to),#000 calc(100% - var(--fx)),rgba(0,0,0,.5) calc(100% - var(--fx) / 2),transparent),linear-gradient(#000 calc(100% - var(--fy)),rgba(0,0,0,.5) calc(100% - var(--fy) / 2),transparent);
-webkit-mask-composite:source-in;
mask-image:linear-gradient(to var(--to),#000 calc(100% - var(--fx)),rgba(0,0,0,.5) calc(100% - var(--fx) / 2),transparent),linear-gradient(#000 calc(100% - var(--fy)),rgba(0,0,0,.5) calc(100% - var(--fy) / 2),transparent);
mask-composite:intersect}
.head::before{left:calc(-1 * var(--gx));right:calc(-1 * var(--fx))}
#num{font-size:clamp(10px,1.5vh,13px);letter-spacing:.36em;color:var(--dim);white-space:nowrap}
#num::after{content:"";display:block;width:min(220px,62%);height:1px;background:var(--rule);margin:clamp(8px,1.6vh,14px) 0 clamp(10px,2.1vh,18px)}
#title{font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(24px,min(2.9vw,5.4vh),44px);line-height:1.06;color:var(--ice);letter-spacing:-.01em;text-wrap:balance;text-shadow:0 0 30px rgba(5,7,10,.9)}
#sub{margin-top:clamp(10px,1.9vh,18px);font-size:clamp(12px,min(1.02vw,1.8vh),14.5px);line-height:1.68;color:#7f9ab1;letter-spacing:.005em;max-width:64ch;overflow:hidden;text-wrap:pretty}
#sub b{font-weight:400;color:var(--ice)}
#sub.clip{overflow-y:auto;pointer-events:auto;overscroll-behavior:contain;scrollbar-width:none;
-webkit-mask-image:linear-gradient(#000 calc(100% - 2.2em),transparent);mask-image:linear-gradient(#000 calc(100% - 2.2em),transparent)}
#sub.clip.end{-webkit-mask-image:none;mask-image:none}
.embedded #sub.clip{overscroll-behavior:auto}
#sub::-webkit-scrollbar{display:none}
.fresh #title,.fresh #sub{animation:rise .9s cubic-bezier(.2,.7,.1,1) both}.fresh #sub{animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

.read{position:fixed;z-index:1;right:var(--gx);top:var(--gy);text-align:right;pointer-events:none}
.read::before{right:calc(-1 * var(--gx));left:calc(-1 * var(--fx));--fx:72px;--fy:64px;--to:left}
.read .ro+.ro{margin-top:clamp(8px,1.8vh,16px)}
.read small{display:block;font-size:clamp(8px,1.3vh,11px);letter-spacing:.3em;color:var(--dim);white-space:nowrap}
.read b{display:block;font-weight:300;color:var(--ice);font-variant-numeric:tabular-nums;white-space:nowrap}
#gb{font-size:clamp(22px,min(3.3vw,6.2vh),48px);line-height:1.12}#gb::after{content:" GB";font-size:.4em;color:var(--dim)}
#drift{font-size:clamp(15px,2.8vh,24px)}#drift.bad{color:var(--coral)}
#task{font-size:clamp(10px,1.8vh,14px);letter-spacing:.14em;color:var(--teal)}
.read .toy{display:inline-block;margin-top:clamp(10px,2.1vh,18px);padding-top:clamp(6px,1.1vh,9px);border-top:1px solid #16222e;font-size:clamp(7.5px,1.2vh,10px);letter-spacing:.24em;color:#3e566b}

.dock{position:fixed;z-index:2;left:50%;bottom:var(--db);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,14px);width:min(1180px,calc(100vw - 2 * var(--gx)))}
#controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#controls:empty{display:none}
button{font:inherit;cursor:pointer;color:var(--ice);border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:1px solid var(--cyan);outline-offset:3px}
#controls button{padding:clamp(7px,1.2vh,11px) clamp(12px,1.4vw,18px);font-size:clamp(11px,1.6vh,13px);letter-spacing:.12em;border-radius:6px;color:#cfe6f8;
background:linear-gradient(#1b2836,#111a23);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -1px 0 rgba(0,0,0,.6),0 0 0 1px #2c4258,0 6px 16px rgba(0,0,0,.5);transition:transform .15s,box-shadow .15s,color .15s}
#controls button:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px #3e5770,0 8px 20px rgba(0,0,0,.6)}
#controls button.on{color:#05070a;background:linear-gradient(#9fe4ff,#5fbfe8);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 1px #7fd8ff,0 0 22px rgba(127,216,255,.35)}
.bar{display:flex;align-items:center;gap:clamp(8px,1.2vw,14px);width:100%}
#rail{flex:1;min-width:0;display:flex;gap:clamp(3px,.45vw,6px)}
.stop{flex:1 1 0;min-width:0;padding:12px 0;text-align:left;color:var(--dim);font-size:clamp(9px,1.35vh,10.5px);letter-spacing:.17em}
.stop i{display:block;height:2px;background:#162230;border-radius:1px;transition:background .3s,box-shadow .3s}
.stop span{display:none}
#rail.labels .stop{padding:9px 0 0}
#rail.labels .stop span{display:block;margin-top:8px;white-space:nowrap;overflow:hidden}
.stop.done i{background:#3e5770}.stop.on i{background:var(--amber);box-shadow:0 0 10px rgba(242,182,90,.5)}.stop.on{color:var(--amber)}
.stop:hover{color:var(--ice)}.stop:hover i{background:#5d7891}.stop.on:hover i{background:var(--amber)}
#prev,#next{flex:none;width:var(--btn);height:var(--btn);border-radius:50%;font-size:clamp(14px,2.2vh,18px);color:#cfe6f8;background:linear-gradient(#1b2836,#0e151d);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px #2c4258}
#prev:disabled{opacity:.3;cursor:default}
.hint{position:fixed;left:var(--gx);bottom:calc(var(--db) + var(--btn) + 22px);font-size:10px;letter-spacing:.2em;color:#33495e;pointer-events:none;white-space:nowrap}

#pip{position:fixed;inset:auto;cursor:default;right:var(--gx);bottom:calc(var(--db) + var(--btn) + 70px);width:clamp(170px,min(24vw,34vh),320px);aspect-ratio:4/3;
opacity:var(--pip,0);transform:translateY(calc((1 - var(--pip,0)) * 10px));pointer-events:none;border-radius:6px;
background:rgba(4,7,10,.92);box-shadow:0 0 0 1px #2c4258,0 10px 30px rgba(0,0,0,.6)}
#ring{position:fixed;right:var(--gx);bottom:calc(var(--db) + var(--btn) + 330px);display:flex;gap:6px;opacity:0;transition:opacity .4s;pointer-events:none}
#ring span{font-size:clamp(9px,1.4vh,11px);letter-spacing:.14em;color:#33495e;padding:5px 8px;border-radius:4px;box-shadow:0 0 0 1px #1b2836;background:rgba(4,7,10,.85);transition:all .25s;white-space:nowrap}
#ring span.on{color:#05070a;background:#f2b65a;box-shadow:0 0 0 1px #f2b65a,0 0 16px rgba(242,182,90,.4)}
@media (max-width:1099px),(max-height:560px){.hint{display:none}}
@media (max-height:420px){.read .ro:nth-child(n+2){display:none}}

@media (max-aspect-ratio:9/10){
:root{--gx:clamp(20px,5.4vw,40px);--gy:clamp(24px,4.4vh,44px);--db:clamp(10px,2vh,22px);--btn:clamp(36px,5vh,44px)}
.hint{display:none}
.head{right:var(--gx);width:auto}
.head::before,.read::before{-webkit-mask-image:none;mask-image:none}
.head::before{right:calc(-1 * var(--gx));bottom:-52px;background:linear-gradient(rgba(5,7,10,.92) 0,rgba(5,7,10,.9) calc(100% - 52px),rgba(5,7,10,0))}
#num{font-size:clamp(10px,2.9vw,12px)}
#num::after{width:min(200px,52%);margin:clamp(8px,1.4vh,12px) 0 clamp(10px,1.8vh,16px)}
#title{font-size:clamp(22px,6.6vw,34px);text-wrap:balance}
#sub{margin-top:clamp(8px,1.4vh,14px);font-size:clamp(11.5px,3.15vw,14px);line-height:1.6;max-width:62ch}
.read{top:auto;left:var(--gx);right:var(--gx);bottom:calc(var(--db) + var(--btn) + 14px);text-align:left;display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:baseline;column-gap:clamp(12px,4.6vw,40px);row-gap:clamp(3px,.6vh,6px)}
.read .ro{display:contents}
.read .ro:nth-child(1)>*{grid-column:1}.read .ro:nth-child(2)>*{grid-column:2}.read .ro:nth-child(3)>*{grid-column:3}
.read .ro small{grid-row:1}.read .ro b{grid-row:2}
.read small{font-size:clamp(7.5px,2.2vw,10px);letter-spacing:.2em}
#gb{font-size:clamp(20px,6.4vw,32px);line-height:1}#drift{font-size:clamp(15px,4.6vw,22px);line-height:1.2}#task{font-size:clamp(10px,2.8vw,13px);line-height:1.5;white-space:normal;overflow-wrap:anywhere}
.read::before{left:calc(-1 * var(--gx));right:calc(-1 * var(--gx));top:-48px;bottom:calc(-1 * (var(--db) + var(--btn) + 14px));background:linear-gradient(rgba(5,7,10,0),rgba(5,7,10,.86) 44px)}
.read .toy{grid-row:3;grid-column:1/-1;margin-top:clamp(4px,.8vh,8px);padding-top:0;border-top:0;font-size:clamp(7.5px,2vw,9.5px);color:#3a5063}
.dock{width:calc(100vw - 2 * var(--gx))}
#pip{width:clamp(150px,46vw,260px)}
#ring span{font-size:clamp(8.5px,2.4vw,10.5px);padding:4px 7px}
}

@media (prefers-reduced-motion:reduce){
.grain{animation:none}
.fresh #title,.fresh #sub{animation:none}
#controls button,.stop i,#ring,#ring span{transition:none}
}
</style>
</head>
